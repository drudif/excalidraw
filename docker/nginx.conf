# Config do nginx pro deploy no Railway.
#
# Substitui o default.conf da imagem. Atencao: remover o default.conf no build
# NAO basta — ele reaparece em runtime, e por vir antes na ordem alfabetica do
# include vira o servidor padrao e atende tudo sem senha. Quem remove de fato e
# o docker/40-htpasswd.sh, no boot. Por isso este arquivo tem outro nome: se
# ambos existirem, da pra ver os dois no `nginx -T` e entender o que houve.

server {
    # default_server explicito: garante que este bloco atende qualquer Host,
    # mesmo se sobrar outro server escutando na 80.
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Senha de acesso. O .htpasswd e gerado no boot do container a partir da
    # variavel APP_PASSWORD (ver docker/40-htpasswd.sh). Protege o app, nao os
    # dados: quem tiver a URL completa de uma sala le a cena direto do Firestore,
    # sem passar por aqui.
    auth_basic           "excalidraw";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Sem fallback de SPA de proposito: o Excalidraw usa hash routing
    # (#json=, #room=), entao rota desconhecida deve mesmo dar 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
