# Config do nginx pro deploy no Railway.
#
# Substitui o default.conf da imagem (que e removido no Dockerfile.railway).
# Nao se chama default.conf de proposito: o script 10-listen-on-ipv6-by-default.sh
# da imagem oficial edita o default.conf pra adicionar o listen IPv6. Como o
# arquivo nao existe mais, ele nao faz nada e o IPv6 fica declarado aqui.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Senha de acesso. O .htpasswd e gerado no boot do container a partir da
    # variavel APP_PASSWORD (ver docker/40-htpasswd.sh). Protege o app, nao os
    # dados: quem tiver a URL completa de uma sala le a cena direto do Firestore,
    # sem passar por aqui.
    auth_basic           "excalidraw";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Sem fallback de SPA de proposito: o Excalidraw usa hash routing
    # (#json=, #room=), entao rota desconhecida deve mesmo dar 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
